# Round robin balancer for the horizontal scale run (infra/scripts/scale-e2e.sh).
# Listens on the stack's usual facilitator and backend ports and spreads each
# HTTP request over two instances of each service.
worker_processes 1;
events {
  worker_connections 1024;
}
http {
  access_log off;
  upstream facilitators {
    server 127.0.0.1:4030;
    server 127.0.0.1:4031;
  }
  upstream backends {
    server 127.0.0.1:4032;
    server 127.0.0.1:4033;
  }
  server {
    listen 127.0.0.1:4020;
    location / {
      proxy_pass http://facilitators;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
  server {
    listen 127.0.0.1:4022;
    location / {
      proxy_pass http://backends;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
