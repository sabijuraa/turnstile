name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22.23.2"
  RUST_VERSION: "1.98.1"
  AGAVE_VERSION: "4.0.2"
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci --error-on-warnings .
      - name: Stub markers
        run: node infra/ci/check-stubs.mjs
      - name: Shell scripts
        run: shellcheck --external-sources infra/scripts/*.sh infra/ci/*.sh infra/docker/*.sh

  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"
          rustc --version
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Cache Agave release and platform tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana
          key: agave-${{ runner.os }}-${{ env.AGAVE_VERSION }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        run: infra/ci/install-agave.sh >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: |
          solana --version
          cargo build-sbf --version
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Each program is built on its own. A workspace wide build unifies features,
      # turns on agent_wallet's cpi feature and yields a broken agent_wallet.so.
      - name: Build programs
        run: |
          for program in agent-wallet settlement; do
            cargo build-sbf --manifest-path "programs/$program/Cargo.toml" --sbf-out-dir target/deploy
          done
          ls -l target/deploy/*.so
          for name in agent_wallet settlement; do
            size=$(stat -c %s "target/deploy/$name.so")
            if [ "$size" -le 16384 ]; then
              echo "::error::target/deploy/$name.so is only $size bytes, so the build is broken."
              exit 1
            fi
          done
      - name: Program tests
        run: cargo test -p settlement -p agent-wallet
      - name: Upload program binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: programs
          path: |
            target/deploy/agent_wallet.so
            target/deploy/settlement.so
          if-no-files-found: error
          retention-days: 7

  ts:
    name: ts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: turnstile
          POSTGRES_PASSWORD: turnstile
          POSTGRES_DB: turnstile
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U turnstile -d turnstile"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://turnstile:turnstile@127.0.0.1:5433/turnstile
      # Each package creates and uses its own turnstile_<pkg>_test database here.
      TEST_DATABASE_ADMIN_URL: postgres://turnstile:turnstile@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrate
        run: pnpm --filter @turnstile/shared migrate
      - name: Test
        run: pnpm test

  docker:
    name: docker (${{ matrix.image.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: validator, file: infra/docker/validator.Dockerfile, service_dir: "" }
          - { name: shared, file: infra/docker/node.Dockerfile, service_dir: packages/shared }
          - { name: facilitator, file: infra/docker/node.Dockerfile, service_dir: packages/facilitator }
          - { name: demo-api, file: infra/docker/node.Dockerfile, service_dir: packages/demo-api }
          - { name: indexer, file: infra/docker/node.Dockerfile, service_dir: packages/indexer }
          - { name: backend, file: infra/docker/node.Dockerfile, service_dir: packages/backend }
          - { name: web, file: infra/docker/node.Dockerfile, service_dir: apps/web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          build-args: |
            SERVICE_DIR=${{ matrix.image.service_dir }}
          push: false
          tags: turnstile/${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  e2e:
    name: e2e
    needs: [rust, ts]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download program binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: programs
          path: target/deploy
      - name: Show program binaries
        run: ls -l target/deploy
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # Infra mode. Validator and Postgres run in docker, the bootstrap writes the
      # deployment and keys, and the suite starts the Node services from their
      # build output. The docker job covers the service images.
      - name: Run the end-to-end suite
        run: infra/scripts/e2e.sh
        env:
          E2E_STACK: infra
      - name: Upload e2e results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: |
            target/e2e-logs
            packages/e2e/results
          if-no-files-found: ignore
          retention-days: 7
