[package]
name = "settlement"
version = "0.1.0"
description = "Turnstile settlement of signed payment authorizations"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "settlement"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "agent-wallet/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022"] }
agent-wallet = { path = "../agent-wallet", features = ["cpi"] }
solana-instructions-sysvar = "3.0.1"

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-transaction-error = "3"
solana-instruction-error = "2"
solana-sdk-ids = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
